# Review Queue: a herdr split panel that tails ~/.claude/review.log, the same file
# ~/.claude/hooks/review-notify.sh already writes to when a Claude Code reply contains a
# <user_review>path</user_review> tag. review-notify.sh also invokes this plugin's `open`
# action so the panel pops open the moment a review item lands, instead of relying only on
# a toast notification that's easy to miss.
id = "bh.review-panel"
name = "Review Queue"
version = "0.1.0"
min_herdr_version = "0.8.0"
platforms = ["linux", "macos"]
description = "Split panel listing files Claude Code flags with <user_review> for you to look at."

[[panes]]
id = "sidebar"
title = "Review Queue"
placement = "split"
command = ["sh", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/scripts/sidebar.sh\""]

[[actions]]
id = "open"
title = "Review Queue: open panel"
contexts = ["pane", "workspace"]
command = ["bash", "scripts/plugin.sh", "open"]

[[actions]]
id = "toggle"
title = "Review Queue: toggle panel"
contexts = ["pane", "workspace"]
command = ["bash", "scripts/plugin.sh", "toggle"]

[[actions]]
id = "clear"
title = "Review Queue: clear log"
contexts = ["pane", "workspace"]
command = ["bash", "scripts/plugin.sh", "clear"]

[[actions]]
id = "close"
title = "Review Queue: close panel"
contexts = ["pane", "workspace"]
command = ["bash", "scripts/plugin.sh", "close"]

[[actions]]
id = "open-item"
title = "Review Queue: open flagged file"
contexts = ["pane", "workspace"]
command = ["bash", "scripts/plugin.sh", "open-item"]

# Ctrl+click support: herdr intercepts clicks on real terminal hyperlinks, not just
# URL-shaped plain text, so sidebar.sh emits OSC 8 hyperlinks (file:// and a synthetic
# herdr-queue://close scheme) - the clicked target lands in HERDR_PLUGIN_CLICKED_URL in
# plugin.sh, independent of whatever label text is shown.
[[link_handlers]]
id = "open-item"
title = "Review Queue: open flagged file"
pattern = "^file://.+$"
action = "open-item"

[[link_handlers]]
id = "close-panel"
title = "Review Queue: close panel"
pattern = "^herdr-queue://close$"
action = "close"

# One popup picker in front of the review queue and other split-pane tools (memex, annotate,
# hunkdiff), bound to a single keybind, instead of a dedicated keybind per plugin.
[[panes]]
id = "tools-menu"
title = "Tools"
placement = "popup"
width = "60%"
height = 14
command = ["sh", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/scripts/tools-menu.sh\""]

[[actions]]
id = "tools-menu"
title = "Tools: open menu"
contexts = ["pane", "workspace"]
command = ["bash", "scripts/plugin.sh", "tools-menu"]
